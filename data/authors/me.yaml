bio: |
  Nianqiao Ju is Assistant Professor of Mathematics at Dartmouth College.
  Her research interests include Bayesian statistics, Monte Carlo methods, differential privacy, and applied statistics.
  Prior to joining Dartmouth, she completed her Ph.D. in Statistics at Harvard University and her B.A. in Mathematics and Physics from Wellesley College.
  Her Chinese name is 鞠念桥 and she also goes by Phyllis.

